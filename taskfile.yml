version: '3'

# Native builds use the system SDL2 and curl. Device builds cross-compile for
# aarch64 inside the toolchain container, statically linking curl and OpenSSL
# because the sysroot has neither libcurl nor a current OpenSSL.
#
# PLATFORM selects the device: my355 (Miyoo Flip), tg5040 (TrimUI Brick /
# Smart Pro) or tg5050 (Smart Pro S). 
#
# Typical device round-trip:  task adb PLATFORM=my355

vars:
  PLATFORM: '{{.PLATFORM | default "my355"}}'
  NATIVE_BUILD_DIR: build/native
  DEVICE_BUILD_DIR: build/{{.PLATFORM}}
  BIN: ra-explorer
  PAK_NAME: RA Explorer.pak
  PAK_DIR: dist/{{.PLATFORM}}/{{.PAK_NAME}}
  IMAGE: ra-explorer-toolchain:{{.PLATFORM}}
  # Fetched cacert
  CACERT: build/cacert.pem
  CACERT_URL: https://curl.se/ca/cacert.pem
  # Sysroot first: my355 ships real SDL2_ttf/SDL2_image .pc files, and only
  # tg5040/tg5050 need our stand-ins.
  DEVICE_PKG_CONFIG_PATH: >-
    /opt/aarch64-nextui-linux-gnu/aarch64-nextui-linux-gnu/libc/usr/lib/pkgconfig:/workspace/cross/pkgconfig

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds: [task --list]

  build:
    desc: Build natively for this machine
    cmds:
      - '[ -f {{.NATIVE_BUILD_DIR}}/build.ninja ] || meson setup {{.NATIVE_BUILD_DIR}}'
      - meson compile -C {{.NATIVE_BUILD_DIR}}

  run:
    desc: Build and run natively
    deps: [build]
    cmds:
      # Apostrophe loads font.ttf from the working directory on desktop.
      - cp -n subprojects/apostrophe/res/font.ttf {{.NATIVE_BUILD_DIR}}/ 2>/dev/null || true
      - cd {{.NATIVE_BUILD_DIR}} && ./{{.BIN}}

  device:
    desc: Cross-compile for PLATFORM (first run also builds curl and OpenSSL)
    deps: [_image]
    cmds:
      - task: _docker
        vars:
          CMD: >-
            sh -c '[ -f {{.DEVICE_BUILD_DIR}}/build.ninja ] ||
            meson setup {{.DEVICE_BUILD_DIR}}
            --cross-file cross/nextui-arm64.ini
            --cross-file cross/{{.PLATFORM}}.ini
            --buildtype release --default-library=static
            --force-fallback-for=openssl'
      - task: _docker
        vars: {CMD: 'meson compile -C {{.DEVICE_BUILD_DIR}}'}

  pak:
    desc: Assemble the Pak for PLATFORM in dist/
    deps: [device, _cacert]
    cmds:
      - rm -rf "{{.PAK_DIR}}"
      - mkdir -p "{{.PAK_DIR}}"
      - cp pak/launch.sh "{{.PAK_DIR}}/"
      - cp {{.CACERT}} "{{.PAK_DIR}}/cacert.pem"
      - chmod +x "{{.PAK_DIR}}/launch.sh"
      - cp {{.DEVICE_BUILD_DIR}}/{{.BIN}} "{{.PAK_DIR}}/{{.BIN}}"
      # Strip only the shipped copy, so the build tree keeps its debug info.
      - task: _docker
        vars:
          CMD: 'aarch64-nextui-linux-gnu-strip "{{.PAK_DIR}}/{{.BIN}}"'
      - 'echo "→ {{.PAK_DIR}}"'

  adb:
    desc: Push the Pak for PLATFORM to a connected device over adb
    deps: [pak]
    vars:
      TOOLS: /mnt/SDCARD/Tools/{{.PLATFORM}}
    cmds:
      # The remote paths contain a space, so they are quoted for the device
      # shell as well as for this one.
      - adb shell "mkdir -p '{{.TOOLS}}'"
      - adb push "{{.PAK_DIR}}" "{{.TOOLS}}/"
      - adb shell "chmod +x '{{.TOOLS}}/{{.PAK_NAME}}/launch.sh' '{{.TOOLS}}/{{.PAK_NAME}}/{{.BIN}}'"

  clean:
    desc: Remove all build output
    cmds:
      - rm -rf build dist

  # ── Internal ──────────────────────────────────────────────────────────────

  _cacert:
    internal: true
    status:
      - test -s {{.CACERT}}
    cmds:
      - mkdir -p $(dirname {{.CACERT}})
      # --fail so an error page is not saved as a certificate bundle, and a
      # sanity check on the result for the same reason.
      - curl -fsS -o {{.CACERT}} {{.CACERT_URL}}
      - grep -q "BEGIN CERTIFICATE" {{.CACERT}}
      - 'echo "cacert.pem: $(grep -c ''BEGIN CERTIFICATE'' {{.CACERT}}) certificates"'

  _image:
    internal: true
    # Built once per platform. Remove the image to pick up Dockerfile changes.
    status:
      - docker image inspect {{.IMAGE}} >/dev/null 2>&1
    cmds:
      - docker build -q --build-arg TOOLCHAIN=ghcr.io/loveretro/{{.PLATFORM}}-toolchain:latest
        -t {{.IMAGE}} docker

  _docker:
    internal: true
    cmds:
      - docker run --rm -v "$PWD:/workspace" -w /workspace
        -e PKG_CONFIG_PATH={{.DEVICE_PKG_CONFIG_PATH}}
        {{.IMAGE}} {{.CMD}}
