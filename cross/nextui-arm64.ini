# Common toolchain settings for all NextUI handhelds.
#
# Always combine with a platform file, which supplies the PLATFORM_* define:
#   --cross-file cross/nextui-arm64.ini --cross-file cross/my355.ini

[binaries]
c          = 'aarch64-nextui-linux-gnu-gcc'
cpp        = 'aarch64-nextui-linux-gnu-g++'
ar         = 'aarch64-nextui-linux-gnu-ar'
strip      = 'aarch64-nextui-linux-gnu-strip'
pkg-config = 'pkg-config'

[host_machine]
system     = 'linux'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'
